<script>
  /**CÁC HÀM PHỤ*/
  function modal_dataluong_3_Reset() {
    var trangThaiDuLieu = $('#modal_dataluong_2_trangthaidulieu').text();
    var trangThaiAction = $('#modal_dataluong_2_trangthaiaction').text();

    if (trangThaiDuLieu === "tính lương kỳ mới" || trangThaiAction === "Đang sửa") {
      Swal.fire({
        title: 'Chú ý!',
        text: 'Bảng tính lương này có dòng đang sửa chưa được lưu vào data. Bạn có tiếp tục đóng không?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Có',
        cancelButtonText: 'Không'
      }).then((result) => {
        if (result.isConfirmed) {
          modal_dataluong_3_resetTableAndFilters();
        }
      });
    } else {
      modal_dataluong_3_resetTableAndFilters();
    }
  }

  /**NHÓM HÀM TẠO GIAO DIỆN BAN ĐẦU*/
  //TẠO SELECT2
  $(document).ready(function () {
    $("#modal_dataluong_2_ChonThang, #modal_dataluong_2_Hoten_filter, #modal_dataluong_2_hopdong_filter, #modal_dataluong_2_donvi_filter").each(function () {
      $(this).select2({
        theme: "bootstrap-5",
        allowClear: true,
        width: 'style', // Dùng 'style' thay vì 'resolve' để giữ nguyên kích thước
        placeholder: $(this).attr("title"), // Đặt placeholder đúng
        //dropdownParent: $("#modal_dataluong_2_Modal"), // Fix lỗi hiển thị trong modal
      }).on("select2:clear", function () {
        // Thay vì đặt giá trị null, hãy đặt lại placeholder
        $(this).val("").trigger("change");
      });
    });
  });


  /**
   * CREATE THE DATA TABLE
   * */

  function modal_dataluong_3_resetTableAndFilters() {
    $('#modal_dataluong_2_trangthaiaction').text('');
    // Reset các bộ lọc ngoài bảng (dropdown filter)
    const externalFilters = [
      '#modal_dataluong_2_Hoten_filter',
      '#modal_dataluong_2_hopdong_filter',
      '#modal_dataluong_2_donvi_filter',
      '#modal_dataluong_2_SoNguoi',
      '#modal_dataluong_2_SoTien'

    ];

    externalFilters.forEach(function (selector) {
      if ($(selector).length) {
        $(selector).val('').trigger('change');
      }
    });

    // Thu gọn các bộ lọc (collapse)
    const filterCollapseButtons = [
      '#modal_dataluong_2_menu'
    ];

    filterCollapseButtons.forEach(function (selector) {
      if ($(selector).length) {
        // Nếu bộ lọc đang mở, ẩn nó đi
        $(selector).collapse('hide');
      }
    });

    var tableId = '#tableDataLuong1';
    var tableDivId = '#modal_dataluong_3_dataTableLuong1_div';

    // Kiểm tra bảng đã tồn tại và destroy nó
    if ($.fn.DataTable.isDataTable(tableId)) {
      // Destroy table
      $(tableId).DataTable().clear().destroy();
      // Xóa toàn bộ nội dung của div chứa bảng
      $(tableDivId).empty();
    }
  }

  async function modal_dataluong_3_tinhLuong() {
    document.getElementById('modal_dataluong_3_dataTableLuong1_div').innerHTML = "";

    if ($.fn.DataTable.isDataTable('#tableDataLuong1')) {
      $('#tableDataLuong1').DataTable().destroy();
    }

    // Bước 1: lấy tháng chọn
    let currentMonthStr = $('#modal_dataluong_2_ChonThang').val();
    if (!currentMonthStr) {
      digicoreToast('Vui lòng chọn tháng trước khi tính lương', 'warning')
      return;
    }

    // Bước 2: kiểm tra tháng chọn nếu đã có tính lương thì gọi hàm lấy dữ liệu tính lương
    // Kiểm tra currentMonthStr trong cached
    const foundRow = (typeof pg_general_3_cacheDataStatusTinhLuong !== 'undefined' && pg_general_3_cacheDataStatusTinhLuong)
      ? pg_general_3_cacheDataStatusTinhLuong.find(row => row[0] === currentMonthStr)
      : null;

    if (foundRow && foundRow[1] === 'Đã tạo thuyết minh') {
      const resultAsk = await Swal.fire({
        title: 'Bảng thuyết minh tháng ' + currentMonthStr + ' đã tồn tại',
        text: 'Bạn muốn xem lại hay tạo bảng mới?',
        icon: 'warning',
        showDenyButton: true,
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        denyButtonColor: '#d33',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Xem lại',
        denyButtonText: 'Tạo bảng mới',
        cancelButtonText: 'Hủy',
        showCloseButton: true,
        allowOutsideClick: true,
      });

      if (resultAsk.isConfirmed) {
        // Người dùng chọn Xem lại
        $('#spinnerModal').modal('show');
        google.script.run
          .withSuccessHandler(function (result) {
            //console.log("Data xem lại: ", result.dataLuongAnCa)
            //console.log("Status: ", result.status)
            if (result.status === "success") {

              pg_general_3_cacheDataLuongAnCa = result.dataLuongAnCa || [];
              // Gọi vẽ bảng lương ở đây, sau khi có dữ liệu
              modal_dataluong_3_TaoBangLuong(pg_general_3_cacheDataLuongAnCa);
              $('#spinnerModal').modal('hide');
            } else if (result.status === "no permission") {
              $('#spinnerModal').modal('hide');
              digicoreToast('Bạn không có quyền xem', 'error');
            } else {
              console.error("Lỗi từ server: ", result.message);
            }
          })
          .withFailureHandler(function (error) {
            console.error("Lỗi API:", error);
          })
          .modal_dataluong_1_getDataLuongAnCa(currentMonthStr, 'DataLuongAnCa');

        return;
      } else if (resultAsk.isDenied) {
        // Người dùng chọn Tạo bảng mới -> Tiếp tục xuống dưới
        $('#spinnerModal').modal('show');
      } else {
        // Người dùng chọn Hủy hoặc đóng popup (bấm X hoặc ra ngoài)
        return;
      }
    } else {
      $('#spinnerModal').modal('show');
    }

    // Nếu CHƯA TÍNH LƯƠNG hoặc người dùng chọn TÍNH BỔ SUNG
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.status === "success") {
          pg_general_3_cacheDataLuongAnCa = result.dataLuongAnCa || []; //result.dataLuongAnCa?.dataLuongAnCa || [];

          //Bước 6: Xóa các thiết lập bảng cũ trước khi tạo bảng mới
          modal_dataluong_3_Reset();

          // Gọi vẽ bảng lương ở đây, sau khi có dữ liệu
          modal_dataluong_3_TaoBangLuong(pg_general_3_cacheDataLuongAnCa);

          // Set trạng thái hành động thành "Đang sửa" để kích hoạt cảnh báo đóng tab
          $('#modal_dataluong_2_trangthaiaction').text('Đang sửa');

          $('#spinnerModal').modal('hide');

          // Hiển thị thông báo để tạo tương tác người dùng -> Kích hoạt beforeunload
          Swal.fire({
            title: 'Hoàn thành',
            text: 'Dữ liệu đã được tạo. Vui lòng kiểm tra và bấm LƯU lại trước khi rời đi.',
            icon: 'success',
            confirmButtonText: 'Đã hiểu'
          });

        } else if (result.status === "no permission") {
          $('#spinnerModal').modal('hide');
          digicoreToast('Bạn không có quyền xem', 'error');
        } else {
          console.error("Lỗi từ server: ", result.message);
        }
      })
      .withFailureHandler(function (error) {
        console.error("Lỗi API:", error);
      })
      .modal_dataluong_1_tinhLuongAnCa(currentMonthStr, 'TinhLuongAnCa');
  }

  //Đoạn code này dùng để tạo bảng và đưa dữ liệu từ data đã lọc theo phân quyền đưa lên bảng
  function modal_dataluong_3_TaoBangLuong(dataArray) {
    //console.log(dataArray)
    if (!dataArray || !Array.isArray(dataArray) || dataArray.length === 0) {
      console.error("Dữ liệu không hợp lệ!");
      return;
    }

    var headers = ['Trạng thái', 'ID', 'Mã CB', 'Họ và tên', 'Lương và truy lĩnh', 'Lương và truy lĩnh kỳ trước', 'Tăng', 'Giảm', 'Ghi chú', 'Phân loại'];
    var tableData = dataArray//.slice(1);

    var tableHtml = `<div'>
      <table class='table table-striped table-bordered' style='font-size:0.9em; width:100%;' id='tableDataLuong1'>
        <thead><tr>
          <th scope='col'>#</th>`;

    headers.forEach((header, colIndex) => {
      tableHtml += `<th scope='col' style="text-align: center; vertical-align: middle;">${header}</th>`;
    });

    tableHtml += `</tr></thead><tbody>`;

    tableData.forEach((row) => {
      tableHtml += `<tr>`;
      //Cột xóa
      tableHtml += `<td style="text-align: center">
                      <i class="fa fa-sharp fa-solid fa-trash btn btn-sm btn-light" 
                        style="font-size:15px;color:#adb5bd;" 
                        onclick="modal_dataluong_3_delRow(this)">
                      </i>
                    </td>`;

      // 1) Cột TRẠNG THÁI (sinh thêm, dựa vào ID = row[0])
      var idValue = row[0] ?? "";
      var statusText = (idValue === '' || idValue === null || idValue === undefined)
        ? 'Chưa lưu'
        : 'Đã lưu';
      tableHtml += `<td class="col-status" style="text-align:center; vertical-align:middle;">${statusText}</td>`;

      row.forEach((cellData, colIndex) => {
        var cellData = row[colIndex] ?? "";

        if (colIndex === 7) {
          // Cột Ghi chú - editable, căn trái, cho phép text & number
          tableHtml += `<td contenteditable="true" class="editable-note" style="text-align: left;" data-original="${cellData ?? ""}">${cellData ?? ""}</td>`;
        } else
          if (colIndex === 5 || colIndex === 6) { // Ăn ca, Còn lĩnh
            tableHtml += `<td style="text-align: right;">${cellData ?? 0}</td>`;
          } else {
            tableHtml += `<td>${cellData ?? ""}</td>`;
          }
      });

      tableHtml += `</tr>`;
    });

    tableHtml += `</tbody></table></div>`;

    $('#modal_dataluong_3_dataTableLuong1_div').html(tableHtml);

    // Hàm xóa dòng
    window.modal_dataluong_3_delRow = function (element) {
      const table = $('#tableDataLuong1').DataTable();
      const row = $(element).closest('tr');

      Swal.fire({
        title: 'Xác nhận xóa?',
        text: "Bạn không thể hoàn tác thao tác này!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Xóa',
        cancelButtonText: 'Hủy'
      }).then((result) => {
        if (result.isConfirmed) {
          table.row(row).remove().draw();
          document.getElementById('modal_dataluong_2_trangthaiaction').value = "Đang sửa"
          Swal.fire('Đã xóa!', 'Dòng đã được xóa khỏi bảng.', 'success');
        }
      });
    };

    // Cập nhật footer
    /*function updateFooterCount() {
      var soDong = 0;
      var columnIndexCheck = 5;  // Cột Họ tên
      var columnIndexSum = 9;   // Cột "Còn lĩnh"
      var tongSoTien = 0;

        if (cellText !== '') {

        }

        var cellValue = $(this).find('td').eq(columnIndexSum).text().trim();
        if (cellValue) {
          // Xử lý định dạng số kiểu vi-VN: Xóa dấu phẩy (,) phân tách hàng nghìn
          var parsedValue = parseFloat(cellValue.replace(/,/g, '').replace(/\./g, ''));
          if (!isNaN(parsedValue)) {
            tongSoTien += parsedValue;

      });

      $('#modal_dataluong_2_SoNguoi').val(soDong); // Hoặc đổi id nếu cần
      $('#modal_dataluong_2_SoTien').val(tongSoTien.toLocaleString('en-US'));
    }*/



    // Khởi tạo DataTable
    $('#tableDataLuong1').DataTable({
      destroy: true,
      responsive: false,
      stateSave: true,
      select: true,
      ordering: true,
      pageLength: 10,
      lengthMenu: [[10, 25, 50, 100, -1], ['10', '25', '50', '100', 'Tất cả']],
      dom: "<'row'<'col-6'l><'col-6'f>>" +
        "<'row'<'col-sm-12'tr>>" +
        "<'row'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
      language: {
        lengthMenu: "_MENU_ ",
        zeroRecords: "Không tìm thấy",
        info: "Hiển thị _START_ đến _END_ trong _TOTAL_ dòng",
        infoEmpty: "Không có dữ liệu",
        infoFiltered: "(lọc từ _MAX_ dòng)",
        search: '<i class="fas fa-search"></i>:',
        paginate: {
          first: "Đầu",
          previous: '<i class="fas fa-chevron-left"></i>',
          next: '<i class="fas fa-chevron-right"></i>',
          last: "Cuối"
        }
      },
      initComplete: function () {
        var table = this.api();

        const columnMappings = {
          0: '#modal_dataluong_2_Hoten_filter',
          3: '#modal_dataluong_2_hopdong_filter',
          9: '#modal_dataluong_2_donvi_filter'
        };

        Object.keys(columnMappings).forEach(function (columnIdx) {
          const column = table.column(parseInt(columnIdx) + 1); // +1 vì có thêm cột Xóa
          const select = $(columnMappings[columnIdx]);

          // Xóa các option cũ trước khi thêm mới
          select.empty();

          select.append('<option value="">Tất cả</option>');
          column.data().unique().sort().each(function (d) {
            select.append(`<option value="${d}">${d}</option>`);
          });

          select.on('change', function () {
            column.search(this.value).draw();
          });
        });
      },
      columnDefs: [
        {
          targets: [5, 6, 7, 8],
          className: 'all right-align',
          render: function (data, type, row, meta) {
            if (type === 'display' || type === 'filter') {
              return data.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }
            return data;
          }
        },
        { targets: 1, className: "tableDataLuong-col-stt" },
        { targets: 2, className: "tableDataLuong-col-id" },
        { targets: 3, className: "tableDataLuong-col-kyluong" },
        { targets: 10, className: "tableDataLuong-col-donvi" },
      ]
    });

    //updateFooterCount();

    // Sự kiện cập nhật khi người dùng chỉnh sửa
    $('#tableDataLuong1')
      .on('change', '.phan-loai-select', function () {
        $('#tableDataLuong1').DataTable().draw();
      })
      .on('blur', 'td[contenteditable="true"]', function () {
        $('#tableDataLuong1').DataTable().draw();
      });

    $('#modal_dataluong_2_trangthaiaction').text('');
    //Cập nhật hàm update khi có filter hoặc search
    $('#searchInput').on('input', function () {
      var value = $(this).val().toLowerCase();
      $('#tableDataLuong1 tbody tr').filter(function () {
        $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
      });
      //updateFooterCount(); // Gọi lại sau khi filter
    });
    $('#tableDataLuong1').on('draw.dt', function () {
      //updateFooterCount();
    });

    //Thêm sự kiện thay đổi cột truy lĩnh
    $('#tableDataLuong1 tbody').on('blur', 'td.editable-number', function () {
      var cell = $(this);
      var newValue = cell.text().trim().replace(/,/g, '');
      var isValidNumber = !isNaN(newValue) && newValue !== '';

      if (!isValidNumber) {
        Swal.fire('Lỗi!', 'Chỉ được nhập số.', 'error');
        cell.text('0');
        newValue = 0;
      }

      // Format lại số (dấu phẩy) và cập nhật vào ô
      var parsedValue = parseFloat(newValue) || 0;
      cell.text(parsedValue.toLocaleString('en-US'));

      // Tính: Còn lĩnh = Ăn ca + Truy lĩnh
      var row = cell.closest('tr');
      var valueAnCa = row.find('td').eq(9).text().trim().replace(/,/g, '');
      var valueTruyLinh = row.find('td').eq(10).text().trim().replace(/,/g, '');

      var valueConLinh = (parseFloat(valueAnCa) || 0) + (parseFloat(valueTruyLinh) || 0);
      row.find('td').eq(11).text(valueConLinh.toLocaleString('en-US'));

      // Cập nhật lại footer
      //updateFooterCount();
    });

    // Sự kiện thay đổi cột Ghi chú
    $('#tableDataLuong1 tbody').on('blur', 'td.editable-note', function () {
      var cell = $(this);
      var newValue = cell.text().trim();
      var originalValue = (cell.attr('data-original') || '').trim();

      // So sánh giá trị mới với giá trị ban đầu
      if (newValue !== originalValue) {
        // Cập nhật trạng thái thành "Chưa lưu"
        var row = cell.closest('tr');
        row.find('td.col-status').text('Chưa lưu');
        $('#modal_dataluong_2_trangthaiaction').text('Đang sửa');
      }
    });
  }


  function formatNumberCell(cell) {
    let value = cell.innerText.trim();

    // Xóa dấu phẩy và kiểm tra nếu là số
    let number = Number(value.replace(/,/g, ''));

    if (!isNaN(number)) {
      cell.innerText = number.toLocaleString('en-US');
    } else {
      // Nếu không phải số, xóa nội dung ô
      cell.innerText = '';
    }
  }


  function modal_dataluong_3_onEditStart() {
    $('#modal_dataluong_2_trangthaiaction').text("Đang sửa");

    // KHÔNG xử lý trong lúc gõ input nữa

    // Khi rời ô mới xử lý
    $(document).off('blur', '.table td[contenteditable="true"]').on('blur', '.table td[contenteditable="true"]', function () {
      var value = $(this).text().trim();

      // Xử lý: chỉ giữ số và 1 dấu chấm
      value = value.replace(/[^0-9.]/g, '');

      var parts = value.split('.');
      if (parts.length > 2) {
        value = parts[0] + '.' + parts.slice(1).join('');
      }

      var number = parseFloat(value);

      if (isNaN(number)) number = 0;

      // Format lại đẹp: 2 số lẻ
      $(this).text(number.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 6 }));
    });
  }

  /**LƯU tính lương*/
  //Steap 1: Lấy dữ liệu từ data table tableDataLuong1
  function modal_dataluong_3_getDataFromTable() {
    const table = $('#tableDataLuong1').DataTable();

    // 🔴 Sort theo cột "Đơn vị" (index 7 vì có cột # ở đầu) trước khi lưu
    table.order([7, 'asc']).draw();

    const rows = table.rows({ search: 'none' }).nodes(); // ✅ lấy toàn bộ DOM dòng (không bị giới hạn bởi phân trang hay bộ lọc)

    const allData = [];

    $(rows).each(function () {
      const row = [];
      $(this).find('td').each(function (index) {
        // Bỏ cột (xóa, STT, ID), lấy từ 3 đến 11
        if (index >= 3 && index <= 11) {
          const text = $(this).text().replace(/,/g, '').trim();
          row.push(text);
        }
      });

      if (row.some(cell => cell !== "")) {
        allData.push(row);
      }
    });

    return allData;
  }

  //Step 2: ghi dữ liệu vào sheet
  async function modal_dataluong_3_luuTinhLuong() {
    let currentMonthStr = $('#modal_dataluong_2_ChonThang').val();
    const targetMonthStr = currentMonthStr || pg_general_3_getTodayMonthStr();

    //A- Kiểm tra targetMonthStr trong cachedMonthData
    const foundRow = (typeof pg_general_3_cacheDataStatusTinhLuong !== 'undefined' && pg_general_3_cacheDataStatusTinhLuong)
      ? pg_general_3_cacheDataStatusTinhLuong.find(row => row[0] === targetMonthStr)
      : null;

    if (foundRow && foundRow[1] === 'Đã tạo thuyết minh') {
      const result = await Swal.fire({
        title: 'Dữ liệu đã chốt',
        text: 'Dữ liệu cho tháng này Đã tạo thuyết minh. Bạn có muốn xóa dữ liệu cũ để ghi đè không?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Có, xóa và ghi đè',
        cancelButtonText: 'Không, hủy bỏ'
      });

      if (!result.isConfirmed) {
        return; // Dừng toàn bộ xử lý
      }

      $('#spinnerModal').modal('show');
      // Nếu người dùng chọn Có, thực hiện xóa dữ liệu cũ
      try {
        await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(() => resolve())
            .withFailureHandler(error => {
              console.error('Lỗi khi xóa dữ liệu cũ:', error);
              digicoreToast('Lỗi khi xóa dữ liệu', 'error');
              reject(error);
            })
            .modal_dataluong_1_xoaDuLieu(targetMonthStr);
        });
      } catch (error) {
        $('#spinnerModal').modal('hide');
        return; // Dừng nếu xóa lỗi
      }
    } else {
      $('#spinnerModal').modal('show');
    }

    //B- Get dữ liệu trên table
    const allData = modal_dataluong_3_getDataFromTable();
    if (!allData || allData.length === 0) {
      $('#spinnerModal').modal('hide');
      digicoreToast("Không có dữ liệu để lưu", "warning");
      return;
    }

    let countSuccess = 0;
    let countFailure = 0;

    function checkCompletion() {
      if (countSuccess === 1) {
        digicoreToast("Dữ liệu đã được lưu thành công", "success");
      } else if (countFailure > 0) {
        digicoreToast("Lỗi khi lưu dữ liệu", "error");
      }
    }

    //C- Lưu dữ liệu allData vào file tính lương

  /**TẠO BẢNG IN*/
  //Step 1: Lấy dữ liệu in từ data table tableDataLuong1
  function modal_dataluong_3_getPrintDataFromTable() {
    const table = $('#tableDataLuong1').DataTable();
    const rows = table.rows({ 'search': 'applied' }).nodes(); // Lấy tất cả DOM rows

    const skipCols = [0, 1, 2]; // 🛠️ Danh sách các cột cần bỏ qua hoàn toàn

    const allData = [];

    $(rows).each(function () {
      const rowData = [];
      $(this).find('td').each(function (index) {
        if (skipCols.includes(index)) return; // Bỏ qua cột không cần lấy

        let value;
        const input = $(this).find('input');
        if (input.length) {
          value = input.val().trim();
        } else {
          value = $(this).text().trim();
        }

        // ❌ Không remove dấu phẩy nữa
        rowData.push(value);
      });

      if (rowData.some(cell => cell !== "")) {
        allData.push(rowData);
      }
    });

    return allData;
  }

  /**
   * HIỆN MODAL NHẬP 4 DÒNG THÔNG TIN BỔ SUNG
   * @param {Array} configData Dữ liệu hiện có (4 dòng [{label, value},...])
   * @param {string} monthStr Kỳ lương
   * @param {Function} onConfirm Callback khi user bấm "Lưu & In"
   */
  function showConfigThuyetMinhModal(configData, monthStr, region, onConfirm) {
    // Xóa modal cũ nếu có
    $('#configThuyetMinhModal').remove();

    // Hàm format dấu chấm khi nhập (hỗ trợ số âm)
    function formatDots(val) {
      if (!val) return "";
      let str = val.toString().trim();
      let isNegative = str.startsWith('-');
      let num = str.replace(/\D/g, ""); // Chỉ lấy số
      let formatted = num.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      if (str === '-') return '-';
      return isNegative ? "-" + formatted : formatted;
    }

    function normalizeRegionText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase();
    }

    function emptyConfigLines(regionName) {
      return [0, 1, 2, 3].map(function () {
        return { region: regionName, label: '', value: '' };
      });
    }

    function buildConfigGroups(rawConfig, regionName) {
      const isAllRegion = normalizeRegionText(regionName) === 'tat ca';
      const defaultRegions = isAllRegion ? ['Hà Nội', 'Phú Thọ'] : [regionName || 'Tất cả'];
      const groupsByRegion = {};

      defaultRegions.forEach(function (regionItem) {
        groupsByRegion[regionItem] = emptyConfigLines(regionItem);
      });

      (Array.isArray(rawConfig) ? rawConfig : []).forEach(function (line) {
        const lineRegion = line.region || defaultRegions[0];
        if (!groupsByRegion[lineRegion]) groupsByRegion[lineRegion] = emptyConfigLines(lineRegion);
        const lineIndex = Number.isInteger(line.index) ? line.index : groupsByRegion[lineRegion].findIndex(item => !item.label && !item.value);
        if (lineIndex >= 0 && lineIndex < 4) {
          groupsByRegion[lineRegion][lineIndex] = {
            region: lineRegion,
            label: line.label || '',
            value: line.value || ''
          };
        }
      });

      return defaultRegions.map(function (regionItem) {
        return {
          region: regionItem,
          lines: groupsByRegion[regionItem]
        };
      });
    }

    const configGroups = buildConfigGroups(configData, region);
    const hasMultipleRegions = configGroups.length > 1;

    const modalHtml = `
    <div class="modal fade" id="configThuyetMinhModal" tabindex="-1" role="dialog" data-backdrop="static">
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fas fa-edit"></i> Thông tin bổ sung — Bảng Thuyết Minh ${monthStr} (${region || 'Tất cả'})
            </h5>
            <button type="button" class="close" id="btnCloseConfigTop"><span>&times;</span></button>
          </div>
          <div class="modal-body">
            <p class="text-muted mb-3">
              <small><i class="fas fa-info-circle"></i> Không bắt buộc nhập. Dòng trống sẽ không hiện trên bản in.</small>
            </p>
            <div class="table-responsive">
              <table class="table table-bordered table-sm">
                <thead class="thead-light">
                  <tr>
                    <th style="width:5%">#</th>
                    ${hasMultipleRegions ? '<th style="width:18%">Khu vực</th>' : ''}
                    <th style="width:60%">Mô tả</th>
                    <th style="width:35%">Số tiền</th>
                  </tr>
                </thead>
                <tbody>
                  ${configGroups.map(group => group.lines.map((line, i) => {
      const rowId = `${group.region.replace(/\W/g, '')}_${i}`;
      const safeRegion = group.region.replace(/"/g, '&quot;');
      const rawVal = line?.value || '';
      const displayVal = formatDots(rawVal);
      return `
                  <tr>
                    <td class="text-center font-weight-bold">(${i + 1})</td>
                    ${hasMultipleRegions ? `<td class="font-weight-bold">${group.region}</td>` : ''}
                    <td><input type="text" class="form-control form-control-sm" id="cfgLabel${rowId}"
                         data-region="${safeRegion}" data-index="${i}"
                         value="${(line?.label || '').replace(/"/g, '&quot;')}"
                         placeholder="Nhập mô tả..."></td>
                    <td><input type="text" class="form-control form-control-sm cfg-money-input" id="cfgValue${rowId}"
                         data-region="${safeRegion}" data-index="${i}"
                         style="text-align: right !important;"
                         value="${displayVal}"
                         placeholder="Nhập số tiền..."></td>
                  </tr>`;
    }).join('')).join('')}
                </tbody>
              </table>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btnCancelConfig">
              <i class="fas fa-times"></i> Hủy
            </button>
            <button type="button" class="btn btn-primary" id="btnSaveAndPrintConfig">
              <i class="fas fa-print"></i> Lưu &amp; In
            </button>
          </div>
        </div>
      </div>
    </div>`;

    $('body').append(modalHtml);

    // Sự kiện format số tiền khi nhập
    $('.cfg-money-input').on('input', function () {
      const formatted = formatDots($(this).val());
      $(this).val(formatted);
    });

    // Hỗ trợ nhấn Enter để Lưu & In
    $('#configThuyetMinhModal input').on('keypress', function (e) {
      if (e.which === 13) $('#btnSaveAndPrintConfig').trigger('click');
    });

    // Xử lý nút "Lưu & In"
    $('#btnSaveAndPrintConfig').on('click', function () {
      let isModified = false;
      const confirmedConfig = [];
      configGroups.forEach(function (group) {
        group.lines.forEach(function (line, i) {
          const rowId = `${group.region.replace(/\W/g, '')}_${i}`;
          const lbl = ($('#cfgLabel' + rowId).val() || '').trim();
          const valWithDots = $('#cfgValue' + rowId).val() || '';
          let rawVal = valWithDots.replace(/\./g, '').trim();
          if (rawVal === '-') {
            rawVal = '';
          }

          // So sánh với bản gốc để check xem có thay đổi không
          const originalLabel = (line?.label || '').trim();
          const originalValue = (line?.value || '').trim();

          if (lbl !== originalLabel || rawVal !== originalValue) {
            isModified = true;
          }

          confirmedConfig.push({
            region: group.region,
            index: i,
            label: lbl,
            value: rawVal
          });
        });
      });

      $('#configThuyetMinhModal').modal('hide');

      // Sau khi modal ẩn hoàn toàn thì mới gọi callback
      $('#configThuyetMinhModal').one('hidden.bs.modal', function () {
        $(this).remove();
        if (typeof onConfirm === 'function') onConfirm(confirmedConfig, isModified);
      });
    });

    // Xử lý nút Hủy & Nút X (Đóng)
    $('#btnCancelConfig, #btnCloseConfigTop').on('click', function () {
      $('#configThuyetMinhModal').modal('hide');
    });

    // Đảm bảo xóa khỏi DOM khi đóng bằng bất kỳ cách nào
    $('#configThuyetMinhModal').on('hidden.bs.modal', function () {
      $(this).remove();
    });

    $('#configThuyetMinhModal').modal('show');
  }

  /**
   * MỞ CỬA SỔ IN: THUYẾT MINH LƯƠNG
   * @param {Array<Array>} rows Dữ liệu lương từ server
   * @param {number} thangT Tháng hiện tại (T)
   * @param {string} nam Năm
   * @param {Array} configLines 4 dòng nhập tay [{label, value}, ...]

  function modal_dataluong_3_getPrintExcelHeadHtml(defaultFileName) {
    const safeDefaultFileName = String(defaultFileName || 'BangIn').replace(/"/g, '&quot;');
    return `
      <style>
        .print-preview-toolbar.no-print {
          position: sticky;
          top: 0;
          z-index: 9999;
          display: flex;
          justify-content: flex-start;
          align-items: center;
          gap: 8px;
          padding: 8px 12px;
          margin: -8px -8px 12px;
          background: #f8fafc;
          border-bottom: 1px solid #d9e2ec;
          box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
          font-family: Arial, sans-serif;
        }

        .print-preview-toolbar .btn-export-excel {
          padding: 7px 14px;
          background: #217346;
          color: #fff;
          border: 0;
          border-radius: 4px;
          cursor: pointer;
          font-family: Arial, sans-serif;
          font-size: 13px;
          font-weight: 600;
        }

        .print-preview-toolbar .btn-export-excel:hover {
          background: #1a5c38;
        }

        @media print {
          .no-print {
            display: none !important;
          }

          body {
            margin-top: 0 !important;
          }
        }
      </style>
      <script>
        window.__defaultExcelFileName = "${safeDefaultFileName}";

        window.exportPrintTablesToExcel = function exportPrintTablesToExcel() {
          if (typeof XLSX === 'undefined') {
            alert('Thu vien SheetJS chua san sang. Vui long thu lai sau vai giay.');
            return;
          }

          const tables = Array.from(document.querySelectorAll('table')).filter(function(table) {
            return !table.closest('.no-print');
          });

          if (!tables.length) {
            alert('Khong tim thay bang du lieu de xuat Excel.');
            return;
          }

          const titleRows = collectPrintTitleRows();
          const ws = XLSX.utils.aoa_to_sheet(titleRows);
          let originRow = titleRows.length ? titleRows.length + 1 : 0;

          tables.forEach(function(table) {
            const clonedTable = cloneTableForExcel(table);
            XLSX.utils.sheet_add_dom(ws, clonedTable, { origin: originRow, raw: false });
            originRow += clonedTable.rows.length + 1;
          });

          const footerRows = collectPrintFooterRows();
          if (footerRows.length) {
            XLSX.utils.sheet_add_aoa(ws, footerRows, { origin: originRow });
            originRow += footerRows.length + 1;
          }

          const signatureRows = collectPrintSignatureRows();
          if (signatureRows.length) {
            XLSX.utils.sheet_add_aoa(ws, signatureRows, { origin: originRow + 1 });
          }

          formatWorksheetNumbers(ws);
          autoFitWorksheetColumns(ws);

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Du lieu in');
          downloadWorkbook(wb, buildExcelFileName());
        };

        function collectPrintTitleRows() {
          const rows = [];
          const header = document.querySelector('.header-section');
          if (!header) return rows;

          header.innerText.split('\\n').map(function(line) {
            return line.trim();
          }).filter(Boolean).forEach(function(line) {
            rows.push([safeExcelText(line)]);
          });

          return rows;
        }

        function collectPrintFooterRows() {
          const footerBlocks = Array.from(document.querySelectorAll('.excel-footer-row'));
          const rows = [];

          footerBlocks.forEach(function(block) {
            const text = block.innerText.trim();
            if (text) rows.push([safeExcelText(text)]);
          });

          return rows;
        }

        function collectPrintSignatureRows() {
          const signatureBlocks = Array.from(document.querySelectorAll('.excel-signature'));
          const rows = [];

          signatureBlocks.forEach(function(block) {
            block.innerText.split('\\n').map(function(line) {
              return line.trim();
            }).filter(Boolean).forEach(function(line) {
              rows.push([safeExcelText(line)]);
            });
          });

          return rows;
        }

        function cloneTableForExcel(table) {
          const clone = table.cloneNode(true);
          Array.from(table.rows).forEach(function(row, rowIndex) {
            Array.from(row.cells).forEach(function(cell, cellIndex) {
              const cloneCell = clone.rows[rowIndex].cells[cellIndex];
              normalizeExcelCell(cell, cloneCell);
            });
          });
          return clone;
        }

        function normalizeExcelCell(sourceCell, targetCell) {
          const text = targetCell.innerText.trim();
          const computedStyle = window.getComputedStyle(sourceCell);
          const isNumber = sourceCell.classList.contains('num') ||
            sourceCell.style.textAlign === 'right' ||
            computedStyle.textAlign === 'right' ||
            computedStyle.textAlign === 'end';

          if (isNumber) {
            const normalized = normalizeIntegerText(text);
            if (normalized !== '' && !isNaN(Number(normalized))) {
              targetCell.innerText = normalized;
              targetCell.setAttribute('data-t', 'n');
              return;
            }
          }

          targetCell.innerText = safeExcelText(text);
          targetCell.setAttribute('data-t', 's');
        }

        function normalizeIntegerText(value) {
          return String(value || '')
            .replace(/\\s/g, '')
            .replace(/[.,]/g, '')
            .replace(/[^0-9-]/g, '');
        }

        function safeExcelText(value) {
          const text = String(value == null ? '' : value);
          return /^[=+\\-@]/.test(text) ? "'" + text : text;
        }

        function formatWorksheetNumbers(ws) {
          Object.keys(ws).forEach(function(address) {
            if (address[0] === '!') return;
            const cell = ws[address];
            if (cell && cell.t === 'n') {
              cell.z = '#,##0';
            }
          });
        }

        function autoFitWorksheetColumns(ws) {
          const range = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : null;
          if (!range) return;

          const widths = [];
          for (let col = range.s.c; col <= range.e.c; col++) {
            let maxLen = 0;
            for (let row = range.s.r; row <= range.e.r; row++) {
              const address = XLSX.utils.encode_cell({ r: row, c: col });
              const cell = ws[address];
              if (!cell || cell.v == null) continue;
              const value = cell.w || cell.v;
              maxLen = Math.max(maxLen, String(value).length);
            }
            widths[col] = { wch: Math.min(Math.max(maxLen + 3, 8), 60) };
          }
          ws['!cols'] = widths;
        }

        function buildExcelFileName() {
          const baseName = window.__defaultExcelFileName || document.title || 'BangIn';
          const cleanName = String(baseName)
            .replace(/[\\s\\/\\\\?*\\[\\]:]+/g, '_')
            .replace(/^_+|_+$/g, '') || 'BangIn';
          return cleanName.endsWith('.xlsx') ? cleanName : cleanName + '.xlsx';
        }

        function downloadWorkbook(wb, fileName) {
          const output = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
          const blob = new Blob([output], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function() {
            URL.revokeObjectURL(url);
          }, 1000);
        }
      <\/script>`;
  }

  function modal_dataluong_3_numberToVietnameseMoney(value) {
    let number = Math.round(Number(value) || 0);
    if (number === 0) return 'Không đồng.';

    const units = ['', ' nghìn', ' triệu', ' tỷ'];
    const readDigit = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];

    function readThreeDigits(num, full) {
      const hundred = Math.floor(num / 100);
      const ten = Math.floor((num % 100) / 10);
      const one = num % 10;
      const parts = [];

      if (hundred > 0 || full) {
        parts.push(readDigit[hundred] + ' trăm');
      }

      if (ten > 1) {
        parts.push(readDigit[ten] + ' mươi');
        if (one === 1) {
          parts.push('mốt');
        } else if (one === 5) {
          parts.push('lăm');
        } else if (one > 0) {
          parts.push(readDigit[one]);
        }
      } else if (ten === 1) {
        parts.push('mười');
        if (one === 5) {
          parts.push('lăm');
        } else if (one > 0) {
          parts.push(readDigit[one]);
        }
      } else if (one > 0) {
        if (hundred > 0 || full) {
          parts.push('linh');
        }
        parts.push(readDigit[one]);
      }

      return parts.join(' ');
    }

    const chunks = [];
    while (number > 0) {
      chunks.push(number % 1000);
      number = Math.floor(number / 1000);
    }

    const words = [];
    for (let i = chunks.length - 1; i >= 0; i--) {
      const chunk = chunks[i];
      if (chunk === 0) continue;
      const full = i < chunks.length - 1 && chunk < 100;
      words.push(readThreeDigits(chunk, full) + units[i % 4]);
      if (i >= 4 && i % 4 === 0) {
        words.push('tỷ');
      }
    }

    //const result = words.join(' ').replace(/\s+/g, ' ').trim();
    const result = words.join(', ').replace(/\s+/g, ' ').trim();
    return result.charAt(0).toUpperCase() + result.slice(1) + ' đồng.';
  }

      if (!container) {

      const clone = container.cloneNode(true);
      const tables = clone.querySelectorAll('table');
      if (!tables.length) {
        alert('Khong tim thay bang du lieu de xuat Excel.');
        return;
      }

      const cleanNumberString = function (value) {
        return String(value || '')
          .trim()
          .replace(/\s/g, '')
          .replace(/[.,]/g, '')
          .replace(/[^0-9-]/g, '');
      };

      const sanitizeExcelText = function (value) {
        const text = String(value == null ? '' : value).trim();
        return /^[=+\-@]/.test(text) ? "'" + text : text;
      };

        table.querySelectorAll('td, th').forEach(function (cell) {
          const row = cell.closest('tr');
          const isTotalRow = row && (row.classList.contains('total-row') || row.style.fontWeight === 'bold');
          const style = cell.getAttribute('style') || '';
          const isNumericCell = cell.classList.contains('num') ||
            style.includes('text-align: right') ||
            (isTotalRow && cell.cellIndex >= 3);

          if (isNumericCell) {
            const normalized = cleanNumberString(cell.innerText);
            if (normalized && !isNaN(Number(normalized))) {
              cell.innerText = normalized;
              cell.setAttribute('data-t', 'n');

          cell.innerText = sanitizeExcelText(cell.innerText);

        const range = window.XLSX.utils.decode_range(ws['!ref']);

      const signatureRows = [];
      clone.querySelectorAll('.excel-signature').forEach(function (block) {
        block.innerText.split('\n')

        window.XLSX.utils.sheet_add_aoa(ws, [[]].concat(signatureRows), { origin: rangeAfterTables.e.r + 2 });

        .replace(/<th([\s][^>]*?)style="/g, `<th$1style="${thStyle} `)

        .replace(/<td([\s][^>]*?)style="/g, `<td$1style="${tdStyle} `);
    };

    const tableHtml = applyBankPrintInlineStyles(`
  <table style="width: 100%; border-collapse: collapse; margin-bottom: 5px; table-layout: fixed;">
    <colgroup>
      <col style="width: 4.5%;">
      <col style="width: 22.5%;">
      <col style="width: 12%;">
      <col style="width: 8%;">
      <col style="width: 12%;">
      <col style="width: 13%;">
      <col style="width: 14%;">
      <col style="width: 14%;">
    </colgroup>
    ${theadHtml}
    <tbody>
      ${tbodyHtml}
      ${finalTotalRow}
    </tbody>
  </table>
  <div class="excel-footer-row" style="margin-top: 6px; font-size: 12px; font-style: italic; line-height: 1.35;">
    <strong>Số tiền bằng chữ:</strong> ${tongSoBangChuText}
  </div>`);

    const exportExcelScript = `
    <script>
      function cleanNumberString(str) {
        let s = String(str || '').trim().replace(/\\s+/g, '');
        if (!s) return '';
        if (s.includes('.') && s.includes(',')) {
          s = s.replace(/\\./g, '').replace(/,/g, '.');
        } else if (s.includes('.')) {
          const dotCount = (s.match(/\\./g) || []).length;
          if (dotCount > 1) {
            s = s.replace(/\\./g, '');
          } else {
            const parts = s.split('.');
            if (parts[1] && parts[1].length === 3) s = s.replace(/\\./g, '');
          }
        } else if (s.includes(',')) {
          const commaCount = (s.match(/,/g) || []).length;
          if (commaCount > 1) {
            s = s.replace(/,/g, '');
          } else {
            const parts = s.split(',');
            s = parts[1] && parts[1].length === 3 ? s.replace(/,/g, '') : s.replace(/,/g, '.');
          }
        }
        return s;
      }

      function sanitizeExcelText(str) {
        const s = String(str || '').trim();
        if (!s) return '';
        return /^[=+\\t\\r@-]/.test(s) ? "'" + s : s;
      }

      function exportExcel() {
        if (typeof XLSX === 'undefined') {
          alert('Thu vien SheetJS chua san sang. Vui long thu lai sau vai giay.');
          return;
        }

        const container = document.getElementById('print-content');
        const clone = container.cloneNode(true);
        const tables = clone.querySelectorAll('table');
        if (!tables.length) {
          alert('Khong tim thay bang du lieu de xuat Excel.');
          return;
        }

        tables.forEach(table => {
          table.querySelectorAll('td, th').forEach(cell => {
            const row = cell.closest('tr');
            const isTotalRow = row && (row.classList.contains('total-row') || row.style.fontWeight === 'bold');
            const cellIndex = cell.cellIndex;
            const isAccountNumber = cellIndex === 2 && !isTotalRow && cell.tagName.toLowerCase() === 'td';

            if (cell.classList.contains('num') || (isTotalRow && cellIndex >= 4)) {
              const normalized = cleanNumberString(cell.innerText);
              if (normalized !== '' && !isNaN(Number(normalized))) {
                cell.innerText = normalized;
                cell.setAttribute('data-t', 'n');
              }
            } else if (isAccountNumber) {
              cell.innerText = sanitizeExcelText(cell.innerText);
              cell.setAttribute('data-t', 's');
            } else {
              cell.innerText = sanitizeExcelText(cell.innerText);
              cell.setAttribute('data-t', 's');
            }
          });
        });

        const ws = XLSX.utils.aoa_to_sheet([
          ["BANG THANH TOAN CHO DOI TUONG THU HUONG"],
          ["(Kem theo giay rut du toan/ uy nhiem chi so ........ ) Ngay .... Thang .... nam ...."],
          ["1. Don vi su dung ngan sach: Truong Dai hoc Cong nghe GTVT"],
          ["2. Ma don vi: 1055621"],
          ["3. Tai khoan thanh toan cua don vi mo tai ngan hang thuong mai: Ngan hang SHB - chi nhanh Ha Noi"],
          []
        ]);

        XLSX.utils.sheet_add_dom(ws, tables[0], { origin: 6, raw: false });

        const wordsDiv = container.querySelector('.excel-footer-row');
        const textBangChu = wordsDiv ? wordsDiv.innerText.trim() : '';
        const rangeAfterTable = XLSX.utils.decode_range(ws['!ref']);
        XLSX.utils.sheet_add_aoa(ws, [[], [textBangChu]], { origin: rangeAfterTable.e.r + 2 });

        const finalRange = XLSX.utils.decode_range(ws['!ref']);
        const colWidths = [];
        for (let C = finalRange.s.c; C <= finalRange.e.c; ++C) {
          let maxLen = 10;
          for (let R = finalRange.s.r; R <= finalRange.e.r; ++R) {
            const cellRef = XLSX.utils.encode_cell({ c: C, r: R });
            const cell = ws[cellRef];
            if (!cell) continue;
            if (cell.t === 'n') cell.z = '#,##0';
            maxLen = Math.max(maxLen, String(cell.v || '').length);
          }
          colWidths.push({ wch: maxLen + 3 });
        }
        ws['!cols'] = colWidths;

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
        XLSX.writeFile(wb, 'Bang_di_ngan_hang_Thang_${thangT}_${nam}.xlsx');
      }
    <\/script>`;

    // ✅ HTML hoàn chỉnh
    const html = `
  <!DOCTYPE html>
  <html>
  <head>
    <meta charset="utf-8">
    <title>Bảng chuyển lương - Tháng ${thangT}/${nam}</title>
    ${css}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>
  </head>
  <body>
    <div class="no-print toolbar">
      <button class="btn-excel" onclick="exportExcel()">Xu&#7845;t Excel</button>
    </div>
    <div id="print-content">
      ${headerHtml}
      ${tableHtml}
    </div>
    ${exportExcelScript}
  </body>
  </html>`;

    // ✅ In
    const printWin = window.open("", "_blank");
    if (!printWin) {
      alert("Trình duyệt đang chặn popup. Hãy cho phép popup để in.");
      return;
    }
    printWin.document.open();
    printWin.document.write(html);
    printWin.document.close();

    printWin.onload = () => setTimeout(() => printWin.print(), 100);
  }
</script>
