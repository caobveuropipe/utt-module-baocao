<div class="modal fade" id="spinnerModal" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" aria-labelledby="spinnerModalLabel">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.15); background: #ffffff;">
			<div class="modal-body text-center p-4">
				<div class="spinner-border text-primary mb-2" role="status" style="width: 3.2rem; height: 3.2rem; border-width: 0.25em;">
					<span class="visually-hidden">Loading...</span>
				</div>
				<p class="mt-2 mb-2 fw-bold text-secondary" id="spinnerModalMessage" style="font-size: 15px;">Đang xử lý dữ liệu...</p>
				
				<!-- Thanh tiến trình & % Hoàn thành -->
				<div class="mb-3" id="spinnerProgressBarContainer" style="width: 100%; max-width: 320px; margin: 0 auto;">
					<div class="d-flex justify-content-between align-items-center mb-1" style="font-size: 12px; font-weight: 600; color: #64748b;">
						<span id="spinnerProgressStatusText">Đang thực thi</span>
						<span id="spinnerProgressPercent">0%</span>
					</div>
					<div class="progress" style="height: 8px; border-radius: 6px; background-color: #e2e8f0; overflow: hidden;">
						<div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" id="spinnerProgressBar" role="progressbar" style="width: 0%; transition: width 0.2s ease;"></div>
					</div>
				</div>

				<!-- Nút Hủy thực thi -->
				<button type="button" class="btn btn-outline-danger btn-sm px-4 py-1 mt-1" id="btnCancelSpinnerAction" style="border-radius: 20px; font-weight: 600; font-size: 13px; transition: all 0.2s;">
					<i class="fas fa-times-circle me-1"></i> Hủy thực thi
				</button>
			</div>
		</div>
	</div>
</div>
